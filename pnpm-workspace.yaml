allowBuilds:
  '@parcel/watcher': true
  electron: true
  esbuild: false

engineStrict: true

# Hoisted layout: keeps every dependency flat under node_modules/ (also needed
# on Windows so that typescript@7 resolves its native platform package
# @typescript/typescript-win32-x64 from the tsc wrapper).
nodeLinker: hoisted

# pnpm holds back any version younger than minimumReleaseAge (1 day by
# default). @freelensapp/extensions is pinned exactly to a nightly that is
# often published on the day it is adopted.
minimumReleaseAgeExclude:
  - '@freelensapp/extensions'
  - '@babel/core@8.0.9'
  - '@babel/helper-string-parser@8.0.8'
  - '@babel/helpers@8.0.8'
  - '@babel/parser@8.0.8'
  - '@babel/types@8.0.8'

shellEmulator: true

# Fail the install, instead of printing one warning line, when a library the
# extension shares with the host is outside the peer range of
# @freelensapp/extensions.
strictPeerDependencies: true
