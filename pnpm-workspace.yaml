allowBuilds:
  '@parcel/watcher': false
  electron: false
  esbuild: false
  node-pty: false

engineStrict: true

# Hoisted layout: keeps every dependency flat under node_modules/.
nodeLinker: hoisted

# pnpm holds back any version younger than minimumReleaseAge (1 day by
# default). @freelensapp/extensions is a version range adopted from the
# fluxcd extension, which is often updated on the day it is published.
minimumReleaseAgeExclude:
  - '@freelensapp/extensions'
  # @vitejs/plugin-react@6 depends on the Babel 8 line, which was published
  # within a day of this extension's update.
  - '@babel/core@8.0.9'
  - '@babel/helper-string-parser@8.0.8'
  - '@babel/helpers@8.0.8'
  - '@babel/parser@8.0.8'
  - '@babel/types@8.0.8'

shellEmulator: true
