apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: hello-everywhere
spec:
  externalSecretName: hello-everywhere
  refreshTime: 1m
  namespaceSelectors:
  - matchLabels:
      kubernetes.io/metadata.name: default
  externalSecretSpec:
    secretStoreRef:
      name: fake-cluster-store
      kind: ClusterSecretStore
    refreshInterval: 30s
    target:
      name: hello-everywhere
    data:
    - secretKey: hello
      remoteRef:
        key: /hello
