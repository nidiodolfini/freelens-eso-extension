apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: hello-world
  namespace: default
spec:
  refreshInterval: 30s
  secretStoreRefs:
  - name: fake-store
    kind: SecretStore
  selector:
    secret:
      name: hello-world
  data:
  - match:
      secretKey: hello
      remoteRef:
        remoteKey: /pushed/hello
